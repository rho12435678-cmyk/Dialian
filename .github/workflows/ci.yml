name: Python CI
on:
  pull_request:
  push:
    branches: [main, 'feat/ddh-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt ruff==0.11.13
      - run: python -m compileall -q config.py dial.py ddh tests
      - run: ruff check config.py dial.py ddh tests
      - run: python -m unittest discover -s tests -v
