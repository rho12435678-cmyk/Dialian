name: Deploy Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            cd /root/Dialian

            mkdir -p deploy-backups
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              BACKUP_FILE="deploy-backups/pre-deploy-$(date +%Y%m%d-%H%M%S).patch"
              git diff --binary > "$BACKUP_FILE"
              git stash push --include-untracked -m "pre-deploy backup $(date -Iseconds)"
            fi
            git pull --ff-only origin main

            source venv/bin/activate

            export TOKEN="${{ secrets.TOKEN }}"
            export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"

            if [ -f bot.pid ]; then
              OLD_PID="$(cat bot.pid)"
              if ps -p "$OLD_PID" > /dev/null 2>&1; then
                kill "$OLD_PID" || true
                sleep 3
              fi
            fi

            pkill -f "[p]ython3 dial.py" || true

            nohup /root/Dialian/venv/bin/python3 dial.py > bot.log 2>&1 < /dev/null &
            echo $! > bot.pid
