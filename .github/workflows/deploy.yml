name: Deploy DDH Bot
# First DDH deployment must explicitly identify the new guild.
# A normal main push no longer restarts the old DDS production process.
on:
  workflow_dispatch:
    inputs:
      ddh_guild_id:
        description: '새 Dial Dev Hub 서버 ID (기존 DDS 서버 ID를 입력하지 마세요)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dialian-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate target
        env:
          DDH_GUILD_ID: ${{ inputs.ddh_guild_id }}
          TOKEN: validation-only
        run: python dial.py --check-config
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tested revision to existing VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DDH_GUILD_ID: ${{ inputs.ddh_guild_id }}
          TOKEN: ${{ secrets.TOKEN }}
          DDH_DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DDH_GUILD_ID,TOKEN,DDH_DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -eu
            cd /root/Dialian
            git fetch origin
            # Refuse to discard live source changes. Runtime data stays outside Git.
            git diff --quiet
            git diff --cached --quiet
            # checkout itself refuses untracked files that would be overwritten;
            # existing untracked venv/runtime files may remain in place.
            git checkout --detach "$DDH_DEPLOY_SHA"
            bash deploy/install.sh
